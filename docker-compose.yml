# FullFrame — production stack (roadmap E5.1).
#   docker compose up -d --build
# Reads secrets from .env (see .env.example). The exhibition DB is a named
# volume — back it up with the schedule in DEPLOY.md.
services:
  fullframe:
    build: .
    image: fullframe:latest
    restart: unless-stopped
    ports:
      - "${FULLFRAME_PORT:-3020}:3020"
    environment:
      TYDAL_BASE_URL: ${TYDAL_BASE_URL:-}
      TYDAL_LINK_BASE_URL: ${TYDAL_LINK_BASE_URL:-}
      FULLFRAME_ENCRYPTION_KEY: ${FULLFRAME_ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_URL: ${APP_URL}
      DATABASE_PATH: /app/data/fullframe.sqlite
      PREVIEW_MODE: "false"
    # Lets TYDAL_BASE_URL=http://host.docker.internal:8000 reach a TYDAL on the
    # host under Linux too (Docker Desktop provides the alias already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fullframe_data:/app/data

volumes:
  fullframe_data:
